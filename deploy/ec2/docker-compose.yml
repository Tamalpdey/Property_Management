name: ${COMPOSE_PROJECT_NAME:-maple-property-services}

services:
  edge:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: ${IMAGE_PREFIX:-maple-property-services}-edge:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.caddy
      args:
        CADDYFILE: ${CADDYFILE:-Caddyfile}
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - tenant-portal
      - admin-portal
      - worker-app
      - lorne-modulith

  redis:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: redis:7-bookworm
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-migration:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: maven:3.9-eclipse-temurin-25
    working_dir: /workspace/db-migration
    profiles: ["migrate"]
    env_file: .env.prod
    volumes:
      - ../../db-migration:/workspace/db-migration:ro
    command:
      - /bin/sh
      - -c
      - mvn -B flyway:migrate -Dflyway.url="$${DB_URL}" -Dflyway.user="$${DB_USERNAME}" -Dflyway.password="$${DB_PASSWORD}"

  lorne-modulith:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: ${IMAGE_PREFIX:-maple-property-services}-lorne-modulith:${IMAGE_TAG:-latest}
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      SERVER_PORT: 8091
      REDIS_HOST: redis
      SPRING_FLYWAY_ENABLED: "false"
      LORNE_BOOTSTRAP_ENABLED: ${LORNE_BOOTSTRAP_ENABLED:-false}
      LOGGING_FILE_NAME: /app/logs/lorne-modulith.log
    volumes:
      - backend_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy

  tenant-portal:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: ${IMAGE_PREFIX:-maple-property-services}-tenant-portal:${IMAGE_TAG:-latest}
    build:
      context: ../../frontend
      dockerfile: tenant-portal/Dockerfile
    restart: unless-stopped
    depends_on:
      - lorne-modulith

  admin-portal:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: ${IMAGE_PREFIX:-maple-property-services}-admin-portal:${IMAGE_TAG:-latest}
    build:
      context: ../../frontend
      dockerfile: admin-portal/Dockerfile
    restart: unless-stopped
    depends_on:
      - lorne-modulith

  worker-app:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: ${IMAGE_PREFIX:-maple-property-services}-worker-app:${IMAGE_TAG:-latest}
    build:
      context: ../../frontend
      dockerfile: worker-app/Dockerfile
    restart: unless-stopped
    depends_on:
      - lorne-modulith

volumes:
  redis_data:
  caddy_data:
  caddy_config:
  backend_logs:
